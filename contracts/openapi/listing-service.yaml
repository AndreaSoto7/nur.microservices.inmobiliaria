openapi: 3.1.0
info:
  title: listing-service
  version: 0.2.0
  description: |
    Propiedades, galería, favoritos y catálogo público de la Plataforma Inmobiliaria.

    - Los clientes llaman siempre a través del gateway (`http://localhost:8080`).
    - Rutas del gateway hacia este servicio: `/api/v1/properties/**`, `/api/v1/favorites/**` y `/api/v1/catalog/**` (público).
    - **Autenticación:** `Authorization: Bearer <access token>` emitido por identity (RS256, `typ=at+jwt`,
      `iss=identity-service`, `aud=inmobiliaria`). Roles del claim `roles`. El `sub` es el `agentId` o el `clientId`.
    - **Públicos (sin token):** `GET /api/v1/catalog/properties`, `GET /api/v1/catalog/properties/{propertyId}`
      y `GET /api/v1/properties/{propertyId}/images/{imageId}`.
    - **Comandos (CQRS):** devuelven como máximo el id creado. Las transiciones de estado son `POST` a un
      sub-recurso de acción y responden `204`. Una transición que no está en la máquina de estados responde
      `409 PROPERTY_INVALID_TRANSITION`.
    - **Máquina de estados de `Property`:** `DRAFT → PUBLISHED`, `PUBLISHED ⇄ PAUSED`, `PUBLISHED ⇄ RESERVED`,
      `PUBLISHED | RESERVED → SOLD` (solo `SALE`) y `PUBLISHED | RESERVED → RENTED` (solo `RENT`).
    - Los errores siguen RFC 9457 (`application/problem+json`) con `code` y `correlationId`. Además de los
      documentados en cada operación: 400 `BAD_REQUEST` / `VALIDATION_ERROR` / `PROPERTY_INVALID_*` (dato inválido
      que detecta el dominio), 401 `AUTH_UNAUTHORIZED`, 403 `PERMISSION_DENIED`, 404 `NOT_FOUND`,
      405 `METHOD_NOT_ALLOWED`, 413 `PROPERTY_IMAGE_TOO_LARGE`, 415 `UNSUPPORTED_MEDIA_TYPE` y 500 `INTERNAL_ERROR`.
    - Colecciones: `{ data, page }`. `page` empieza en 1; `size` vale 20 por defecto y como máximo 100.
servers:
  - url: http://localhost:8080
    description: API Gateway (desarrollo)
tags:
  - name: properties
    description: Comandos y vistas del agente sobre sus propiedades
  - name: images
    description: Galería de una propiedad (máximo 5 imágenes JPG o PNG de hasta 5 MB)
  - name: catalog
    description: Catálogo público con filtros (lado query de CQRS)
  - name: favorites
    description: Propiedades guardadas por el usuario (ADR 0003)
  - name: health
    description: Liveness y readiness (no se exponen por el gateway)

paths:
  /api/v1/properties:
    post:
      tags: [properties]
      operationId: createProperty
      summary: Crear una propiedad (nace en DRAFT)
      security: [{ bearerAuth: [] }]
      description: Solo `AGENT`. La propiedad queda a nombre del agente del token.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePropertyRequest' }
            example:
              title: Casa con jardín en Equipetrol
              description: Casa de dos plantas con jardín y garaje para dos autos.
              propertyType: HOUSE
              operationType: SALE
              price: { amount: 1285000.00, currency: BOB }
              location: { zone: Equipetrol, address: 'Calle 7 Oeste #120', latitude: -17.7633, longitude: -63.1956 }
      responses:
        '201':
          description: Creada
          headers:
            Location: { schema: { type: string }, example: /api/v1/properties/3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
              example: { id: 3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [properties]
      operationId: listMyProperties
      summary: Listar mis propiedades (todos los estados)
      security: [{ bearerAuth: [] }]
      description: Solo `AGENT`. Devuelve únicamente las propiedades del agente del token.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: '`campo,asc|desc`, repetible. Campos: `createdAt`, `updatedAt`, `price`, `title`. Por defecto `createdAt,desc`.'
          schema: { type: array, items: { type: string } }
          example: [price,asc]
      responses:
        '200':
          description: Página de propiedades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertySummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/properties/{propertyId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [properties]
      operationId: getMyProperty
      summary: Ver el detalle de una propiedad propia
      security: [{ bearerAuth: [] }]
      description: Solo `AGENT` dueño. Si la propiedad es de otro agente, responde 404.
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
    put:
      tags: [properties]
      operationId: editProperty
      summary: Editar título, descripción, precio y ubicación
      security: [{ bearerAuth: [] }]
      description: |
        Reemplazo completo de los datos editables. Solo el agente dueño; no si está `SOLD` o `RENTED`.
        Si está `PUBLISHED` o `RESERVED` publica `PropertyUpdated` y actualiza el catálogo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditPropertyRequest' }
            example:
              title: Casa con jardín en Equipetrol
              description: Precio rebajado.
              price: { amount: 1250000.00, currency: BOB }
              location: { zone: Equipetrol }
      responses:
        '204': { description: Editada }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/properties/{propertyId}/features:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/CorrelationId'
    put:
      tags: [properties]
      operationId: updatePropertyFeatures
      summary: Registrar dormitorios, baños, superficie y extras
      security: [{ bearerAuth: [] }]
      description: Solo el agente dueño; no si está `SOLD` o `RENTED`. Reemplaza las características.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFeaturesRequest' }
            example: { bedrooms: 3, bathrooms: 2, areaM2: 240.5, features: [GARAGE, GARDEN] }
      responses:
        '204': { description: Actualizadas }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/properties/{propertyId}/publish:
    post:
      tags: [properties]
      operationId: publishProperty
      summary: Publicar (DRAFT o PAUSED → PUBLISHED)
      description: Exige al menos una foto y dormitorios, baños y superficie. Publica `PropertyPublished`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Transición aplicada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/properties/{propertyId}/pause:
    post:
      tags: [properties]
      operationId: pauseProperty
      summary: Pausar (PUBLISHED → PAUSED)
      description: Sale del catálogo. Publica `PropertyPaused`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Transición aplicada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/properties/{propertyId}/reserve:
    post:
      tags: [properties]
      operationId: reserveProperty
      summary: Reservar (PUBLISHED → RESERVED)
      description: Publica `PropertyReserved`. También ocurre sola cuando llega `LeadClosed` con `outcome=WON` (ADR 0005).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Transición aplicada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/properties/{propertyId}/release-reservation:
    post:
      tags: [properties]
      operationId: releasePropertyReservation
      summary: Liberar la reserva (RESERVED → PUBLISHED)
      description: Publica `PropertyPublished` con `previousStatus=RESERVED`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Transición aplicada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/properties/{propertyId}/mark-sold:
    post:
      tags: [properties]
      operationId: markPropertySold
      summary: Marcar como vendida (solo SALE; irreversible)
      description: Desde `PUBLISHED` o `RESERVED`. Publica `PropertySold`. Si la operación es `RENT` responde 409 `PROPERTY_OPERATION_MISMATCH`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Transición aplicada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/properties/{propertyId}/mark-rented:
    post:
      tags: [properties]
      operationId: markPropertyRented
      summary: Marcar como alquilada (solo RENT)
      description: Desde `PUBLISHED` o `RESERVED`. Publica `PropertyRented`. Si la operación es `SALE` responde 409 `PROPERTY_OPERATION_MISMATCH`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Transición aplicada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/properties/{propertyId}/images:
    post:
      tags: [images]
      operationId: addPropertyImages
      summary: Agregar imágenes a la galería
      description: |
        Solo el agente dueño; no si está `SOLD` o `RENTED`. JPG o PNG (se valida el tipo real por su firma),
        hasta 5 MB cada una y 5 en total. La primera imagen de la galería es la portada.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Imágenes agregadas
          content:
            application/json:
              schema:
                type: object
                required: [imageIds]
                properties:
                  imageIds: { type: array, items: { type: string, format: uuid } }
              example: { imageIds: [5a1f0c2e-7b3d-4e6f-9a10-1b2c3d4e5f60] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/properties/{propertyId}/images/{imageId}:
    get:
      tags: [images]
      operationId: getPropertyImage
      summary: Descargar una imagen (público)
      description: Responde 404 si la propiedad está en `DRAFT` o `PAUSED`.
      security: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La imagen
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/PropertyNotFound' }

  /api/v1/catalog/properties:
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Buscar en el catálogo público
      description: Solo propiedades `PUBLISHED` y `RESERVED`. Todos los filtros son opcionales y se combinan con AND.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: zone, in: query, description: 'Zona exacta, sin distinguir mayúsculas.', schema: { type: string }, example: equipetrol }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/PropertyType' } }
        - { name: operation, in: query, schema: { $ref: '#/components/schemas/OperationType' } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: bedrooms, in: query, description: 'Dormitorios mínimos.', schema: { type: integer, minimum: 0 } }
        - name: features
          in: query
          description: La propiedad debe tener todas. Separadas por coma.
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/Feature' } }
          example: [GARAGE, POOL]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: '`campo,asc|desc`, repetible. Campos: `price`, `publishedAt`, `areaM2`, `bedrooms`. Por defecto `publishedAt,desc`.'
          schema: { type: array, items: { type: string } }
          example: [price,asc]
      responses:
        '200':
          description: Página del catálogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertySummaryPage' }
              example:
                data:
                  - id: 3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01
                    title: Casa con jardín en Equipetrol
                    propertyType: HOUSE
                    operationType: SALE
                    status: PUBLISHED
                    price: { amount: 1285000.00, currency: BOB }
                    zone: Equipetrol
                    bedrooms: 3
                    bathrooms: 2
                    areaM2: 240.50
                    features: [GARAGE, GARDEN]
                    coverImageUrl: /api/v1/properties/3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01/images/5a1f0c2e-7b3d-4e6f-9a10-1b2c3d4e5f60
                    publishedAt: '2026-10-16T14:30:00Z'
                    updatedAt: '2026-10-16T14:30:00Z'
                page: { number: 1, size: 20, totalElements: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/catalog/properties/{propertyId}:
    get:
      tags: [catalog]
      operationId: getCatalogProperty
      summary: Ver el detalle público de una propiedad
      description: Solo si está `PUBLISHED` o `RESERVED`; si no, 404.
      security: []
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyDetail' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }

  /api/v1/favorites:
    get:
      tags: [favorites]
      operationId: listMyFavorites
      summary: Listar mis favoritos
      description: '`CLIENT` o `AGENT`. Muestra el estado actual de cada propiedad. Orden: guardados más recientes primero.'
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de favoritos
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Favorite' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [favorites]
      operationId: addFavorite
      summary: Guardar una propiedad en favoritos
      description: Solo propiedades `PUBLISHED`, sin repetir.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId]
              properties:
                propertyId: { type: string, format: uuid }
            example: { propertyId: 3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01 }
      responses:
        '201':
          description: Guardada
          headers:
            Location: { schema: { type: string }, example: /api/v1/favorites/3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PropertyNotFound' }
        '409':
          description: '`FAVORITE_ALREADY_EXISTS` o `FAVORITE_PROPERTY_NOT_PUBLISHED`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/favorites/{propertyId}:
    delete:
      tags: [favorites]
      operationId: removeFavorite
      summary: Quitar una propiedad de favoritos
      description: Se puede quitar en cualquier estado de la propiedad.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PropertyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '204': { description: Quitada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`FAVORITE_NOT_FOUND`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: Lo usa Consul cada 10 s. No revisa la base ni Kafka.
      security: []
      servers:
        - url: http://listing-service:8002
          description: Red interna de Docker (no pasa por el gateway)
      responses:
        '200':
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: Revisa la conexión a la base de datos. Lo usa el HEALTHCHECK de Docker.
      security: []
      servers:
        - url: http://listing-service:8002
          description: Red interna de Docker (no pasa por el gateway)
      responses:
        '200':
          description: Listo para atender.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: La base no responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      description: Si no llega, se genera. Se devuelve en la respuesta y viaja en los eventos.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR`: request mal formado o campos inválidos'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://inmobiliaria.local/problems/validation-error
            title: Datos inválidos
            status: 400
            detail: Hay campos con errores
            instance: /api/v1/properties
            code: VALIDATION_ERROR
            correlationId: c0a8f3e2-5b1d-4e2a-9c7f-1a2b3c4d5e6f
            errors: [{ field: price.amount, message: debe ser mayor a 0 }]
    Unauthorized:
      description: '`AUTH_UNAUTHORIZED`: falta el token o no es válido'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`PERMISSION_DENIED`: el rol no permite la operación'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotOwner:
      description: '`PERMISSION_DENIED` (rol) o `PROPERTY_NOT_OWNER` (la propiedad es de otro agente)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PropertyNotFound:
      description: '`PROPERTY_NOT_FOUND`'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        Regla de negocio: `PROPERTY_INVALID_TRANSITION`, `PROPERTY_WITHOUT_IMAGES`, `PROPERTY_INCOMPLETE`,
        `PROPERTY_OPERATION_MISMATCH`, `PROPERTY_IMAGE_LIMIT` o `PROPERTY_CONCURRENT_UPDATE`.
        Editar una propiedad vendida o alquilada también es `PROPERTY_INVALID_TRANSITION`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://inmobiliaria.local/problems/property-invalid-transition
            title: Transición de estado inválida
            status: 409
            detail: No se puede pasar una propiedad de PAUSED a SOLD
            instance: /api/v1/properties/3f6c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01/mark-sold
            code: PROPERTY_INVALID_TRANSITION
            correlationId: c0a8f3e2-5b1d-4e2a-9c7f-1a2b3c4d5e6f

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
    PropertyType: { type: string, enum: [HOUSE, APARTMENT] }
    OperationType: { type: string, enum: [SALE, RENT] }
    PropertyStatus: { type: string, enum: [DRAFT, PUBLISHED, PAUSED, RESERVED, SOLD, RENTED] }
    Feature:
      type: string
      enum: [GARAGE, GARDEN, POOL, COMMON_AREAS, BALCONY, ELEVATOR, SECURITY, FURNISHED, PET_FRIENDLY, AIR_CONDITIONING]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, exclusiveMinimum: 0, description: Máximo 2 decimales. En RENT es el precio mensual. }
        currency: { type: string, const: BOB }
    Location:
      type: object
      required: [zone]
      properties:
        zone: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90, description: Va junto con longitude. }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CreatePropertyRequest:
      type: object
      required: [title, propertyType, operationType, price, location]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 5000 }
        propertyType: { $ref: '#/components/schemas/PropertyType' }
        operationType: { $ref: '#/components/schemas/OperationType' }
        price: { $ref: '#/components/schemas/Money' }
        location: { $ref: '#/components/schemas/Location' }
    EditPropertyRequest:
      type: object
      required: [title, price, location]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 5000 }
        price: { $ref: '#/components/schemas/Money' }
        location: { $ref: '#/components/schemas/Location' }
    UpdateFeaturesRequest:
      type: object
      required: [bedrooms, bathrooms, areaM2]
      properties:
        bedrooms: { type: integer, minimum: 0, maximum: 100 }
        bathrooms: { type: integer, minimum: 0, maximum: 100 }
        areaM2: { type: number, exclusiveMinimum: 0 }
        features: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Feature' } }
    IdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PropertySummary:
      type: object
      required: [id, title, propertyType, operationType, status, price, zone, features]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        propertyType: { $ref: '#/components/schemas/PropertyType' }
        operationType: { $ref: '#/components/schemas/OperationType' }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        price: { $ref: '#/components/schemas/Money' }
        zone: { type: string }
        bedrooms: { type: [integer, 'null'] }
        bathrooms: { type: [integer, 'null'] }
        areaM2: { type: [number, 'null'] }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
        coverImageUrl: { type: [string, 'null'], description: 'Ruta relativa al gateway: /api/v1/properties/{propertyId}/images/{imageId}' }
        publishedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    PropertySummaryPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PropertySummary' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    PropertyDetail:
      type: object
      required: [id, agentId, title, description, propertyType, operationType, status, price, location, features, images, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        propertyType: { $ref: '#/components/schemas/PropertyType' }
        operationType: { $ref: '#/components/schemas/OperationType' }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        price: { $ref: '#/components/schemas/Money' }
        location: { $ref: '#/components/schemas/Location' }
        bedrooms: { type: [integer, 'null'], description: null en DRAFT si todavía no se registró. }
        bathrooms: { type: [integer, 'null'] }
        areaM2: { type: [number, 'null'] }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
        images:
          type: array
          items:
            type: object
            required: [id, position, url]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer, minimum: 0, maximum: 4, description: 0 es la portada. }
              url: { type: string }
        publishedAt: { type: [string, 'null'], format: date-time, description: Primera publicación. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Favorite:
      type: object
      required: [property, savedAt]
      properties:
        property: { $ref: '#/components/schemas/PropertySummary' }
        savedAt: { type: string, format: date-time }
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: RFC 9457 con las extensiones del proyecto (`code`, `correlationId`, `errors`).
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Estable, en UPPER_SNAKE_CASE.
          examples: [VALIDATION_ERROR, PROPERTY_INVALID_TRANSITION, PROPERTY_NOT_FOUND, FAVORITE_ALREADY_EXISTS]
        correlationId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        errors:
          type: array
          description: Solo en errores de validación.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
