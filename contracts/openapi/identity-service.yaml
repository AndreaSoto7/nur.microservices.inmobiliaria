openapi: 3.1.0
info:
  title: identity-service
  version: 1.1.1
  description: |
    Registro, autenticación y emisión de JWT RS256 de la Plataforma Inmobiliaria.

    - Los clientes llaman siempre a través del gateway (`http://localhost:8080`).
    - Los tokens se validan en el resto de servicios con el JWKS publicado aquí.
    - **Access token** (15 min). Header: `alg=RS256`, `kid` y `typ=at+jwt` (RFC 9068).
      Claims: `sub` (UUID del usuario), `email`, `roles`, `iss=identity-service`, `aud=inmobiliaria`, `iat`, `exp`, `jti` y `tokenType=access`.
    - **Refresh token** (7 días). Header: `typ=rt+jwt`. Claims: `sub`, `iss`, `iat`, `exp`, `jti`, `fid` (UUID de la familia de tokens) y `tokenType=refresh`, con
      `aud=identity-service`: solo lo acepta identity. Es de un solo uso: cada refresh entrega un par nuevo, con otros 7 días de vida (sesión deslizante).
    - **Cómo valida un consumidor** (gateway y servicios): firma con el JWKS (eligiendo la clave por `kid`), `alg=RS256`,
      `iss=identity-service`, `aud=inmobiliaria`, `exp` y `typ=at+jwt`. Con eso, un refresh token nunca pasa como access token.
    - Los errores siguen RFC 9457 (`application/problem+json`). Además de los documentados en cada operación:
      identity responde 404 `NOT_FOUND`, 405 `METHOD_NOT_ALLOWED`, 406 `NOT_ACCEPTABLE` y 500 `INTERNAL_ERROR`; el gateway responde 413, 502, 503 y 504 (`GATEWAY_*`).
servers:
  - url: http://localhost:8080
    description: API Gateway (desarrollo)
tags:
  - name: auth
    description: Registro, login, renovación de tokens y claves públicas
  - name: health
    description: Liveness y readiness (no se exponen por el gateway)

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Registrar un usuario
      description: |
        Crea un usuario con rol `CLIENT` (por defecto) o `AGENT`.
        El rol `ADMIN` no se puede obtener por registro público.
        Endpoint público. El gateway le aplica rate limit (hashear es caro y el 409 revela si un email existe).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              client:
                value:
                  email: ana.perez@example.com
                  password: S3gura-2026
                  fullName: Ana Pérez
              agent:
                value:
                  email: carlos.agente@example.com
                  password: S3gura-2026
                  fullName: Carlos Rojas
                  role: AGENT
      responses:
        '201':
          description: |
            Usuario creado. Devuelve solo su ID (comando CQRS).
            Sin header `Location`: en v1 no existe `GET /api/v1/users/{id}`. Se agregará junto con ese endpoint.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
              example:
                id: 6f1c2a7e-1b2d-4c8e-9f10-5a6b7c8d9e01
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: El email ya está registrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://inmobiliaria.local/problems/user-email-already-registered
                title: Email ya registrado
                status: 409
                detail: Ya existe un usuario con ese email.
                instance: /api/v1/auth/register
                code: USER_EMAIL_ALREADY_REGISTERED
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión
      description: |
        Valida email y contraseña y devuelve un par de tokens.
        Un email inexistente, una contraseña incorrecta y un usuario inactivo dan exactamente el mismo 401 (y tardan lo
        mismo), para no revelar qué emails están registrados.
        El 401 no lleva `WWW-Authenticate`: las credenciales viajan en el body, no en un esquema de autenticación HTTP.
        Endpoint público. El gateway le aplica rate limit.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana.perez@example.com
              password: S3gura-2026
      responses:
        '200':
          description: Credenciales válidas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              description: Las respuestas con tokens no se guardan en cachés (RFC 6749, sección 5.1).
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6ImF0K2p3dCJ9...
                refreshToken: eyJhbGciOiJSUzI1NiIsInR5cCI6InJ0K2p3dCJ9...
                tokenType: Bearer
                expiresIn: 900
        '400':
          description: Body mal formado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://inmobiliaria.local/problems/validation-error
                title: Datos inválidos
                status: 400
                detail: Uno o más campos no son válidos.
                instance: /api/v1/auth/login
                code: VALIDATION_ERROR
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
                errors:
                  - field: password
                    message: Este campo es requerido.
        '401':
          description: Email o contraseña incorrectos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://inmobiliaria.local/problems/auth-invalid-credentials
                title: Credenciales inválidas
                status: 401
                detail: Email o contraseña incorrectos.
                instance: /api/v1/auth/login
                code: AUTH_INVALID_CREDENTIALS
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Renovar los tokens
      description: |
        Canjea un refresh token por un par nuevo (rotación): cada refresh token sirve una sola vez.
        Si alguien reutiliza uno ya usado (señal de robo), se revocan todos los refresh tokens de su familia y el usuario debe volver a iniciar sesión.
        La revocación afecta solo a los refresh tokens: los access tokens ya emitidos siguen siendo válidos hasta su `exp` (máximo 15 min).

        Un token inválido, vencido, reutilizado o de un usuario inactivo dan el mismo 401, sin `WWW-Authenticate`: la credencial viaja en el body. También da 401 cualquier otro string que no sea un refresh token válido, incluido un access token. El 400 es solo para un body mal formado: falta el campo, no es string, está vacío o supera el tope.

        **Qué debe hacer el cliente:** la rotación no tiene período de gracia. Debe serializar los refresh (dos pestañas a la vez revocarían la familia) y guardar el token nuevo antes de usarlo. Solo un 401 cierra la sesión; un 5xx o un error de red no.

        Endpoint público: la credencial es el propio refresh token.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokensRequest'
            example:
              refreshToken: eyJhbGciOiJSUzI1NiIsInR5cCI6InJ0K2p3dCJ9...
      responses:
        '200':
          description: Par de tokens nuevo. El refresh token recibido deja de servir.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              description: Las respuestas con tokens no se guardan en cachés (RFC 6749, sección 5.1).
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6ImF0K2p3dCJ9...
                refreshToken: eyJhbGciOiJSUzI1NiIsInR5cCI6InJ0K2p3dCJ9...
                tokenType: Bearer
                expiresIn: 900
        '400':
          description: Body mal formado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://inmobiliaria.local/problems/validation-error
                title: Datos inválidos
                status: 400
                detail: Uno o más campos no son válidos.
                instance: /api/v1/auth/refresh
                code: VALIDATION_ERROR
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
                errors:
                  - field: refreshToken
                    message: Este campo es requerido.
        '401':
          description: Refresh token inválido, vencido, reutilizado o de un usuario inactivo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://inmobiliaria.local/problems/auth-invalid-refresh-token
                title: Refresh token inválido
                status: 401
                detail: La sesión no es válida. Inicia sesión de nuevo.
                instance: /api/v1/auth/refresh
                code: AUTH_INVALID_REFRESH_TOKEN
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6

  /api/v1/auth/.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJwks
      summary: Claves públicas para validar los JWT
      description: |
        JSON Web Key Set con la clave pública RS256.
        Lo consumen el gateway y todos los servicios. Endpoint público.
        El `kid` es la huella RFC 7638 de la clave pública (SHA-256 en base64url). Si llega un token con un `kid`
        desconocido, el consumidor vuelve a pedir el JWKS.
      responses:
        '200':
          description: JWKS.
          headers:
            Cache-Control:
              description: Se puede cachear 5 minutos. Cambia solo al rotar la clave.
              schema:
                type: string
                const: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                  - kty: RSA
                    use: sig
                    alg: RS256
                    kid: NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs
                    n: 0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM78LhWx4cbbfAAtVT86zwu1RK7aPFFxuhDR1L6tSoc_BJECPebWKRXjBZCiFV4n3oknjhMstn64tZ_2W-5JsGY4Hc5n9yBXArwl93lqt7_RN5w6Cf0h4QyQ5v-65YGjQR0_FDW2QvzqY368QQMicAtaSqzs8KJZgnYb9c7d0zgdAZHzu6qMQvRL5hajrn1n91CbOpbISD08qNLyrdkt-bFTWhAI4vMQFh6WeZu0fM4lFd2NcRwr3XPksINHaQ-G_xBniIqbw0Ls1jF44-csFCur-kEgU8awapJzKnqDKgw
                    e: AQAB

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: Lo usa Consul cada 10 s. No revisa dependencias.
      servers:
        - url: http://identity-service:8001
          description: Red interna de Docker (no pasa por el gateway)
      responses:
        '200':
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: Revisa la conexión a la base de datos y que la clave de firma esté disponible.
      servers:
        - url: http://identity-service:8001
          description: Red interna de Docker (no pasa por el gateway)
      responses:
        '200':
          description: Listo para atender.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Si no llega o no cumple el formato, lo genera el gateway (o el servicio). Se devuelve en la respuesta.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'

  headers:
    CorrelationId:
      description: El mismo valor recibido, o uno generado.
      schema:
        type: string

  responses:
    RateLimited:
      description: Lo responde el gateway al superar el rate limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://inmobiliaria.local/problems/gateway-rate-limited
            title: Demasiadas peticiones
            status: 429
            detail: Espera un momento antes de volver a intentar.
            code: GATEWAY_RATE_LIMITED
            correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
    ValidationError:
      description: Request mal formado o con campos inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidFields:
              value:
                type: https://inmobiliaria.local/problems/validation-error
                title: Datos inválidos
                status: 400
                detail: Uno o más campos no son válidos.
                instance: /api/v1/auth/register
                code: VALIDATION_ERROR
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
                errors:
                  - field: email
                    message: Introduzca una dirección de correo electrónico válida.
            invalidEmail:
              summary: El formato pasa la validación general, pero el dominio lo rechaza (por ejemplo, sin punto en el dominio)
              value:
                type: https://inmobiliaria.local/problems/user-invalid-email
                title: Email inválido
                status: 400
                detail: El email no es válido.
                instance: /api/v1/auth/register
                code: USER_INVALID_EMAIL
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
            weakPassword:
              value:
                type: https://inmobiliaria.local/problems/user-weak-password
                title: Contraseña débil
                status: 400
                detail: La contraseña debe tener entre 8 y 128 caracteres.
                instance: /api/v1/auth/register
                code: USER_WEAK_PASSWORD
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6
            roleNotAllowed:
              value:
                type: https://inmobiliaria.local/problems/user-role-not-allowed
                title: Rol no permitido
                status: 400
                detail: Solo se puede registrar con rol CLIENT o AGENT.
                instance: /api/v1/auth/register
                code: USER_ROLE_NOT_ALLOWED
                correlationId: c0a8e1f2-3b4c-4d5e-8f60-718293a4b5c6

  schemas:
    RegisterUserRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        role:
          type: string
          enum: [CLIENT, AGENT]
          default: CLIENT

    RegisterUserResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: En el login no aplica la política de 8 a 128 caracteres; el tope solo evita abusos.

    RefreshTokensRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT RS256 (`typ=at+jwt`, `aud=inmobiliaria`). Claims en la descripción general.
        refreshToken:
          type: string
          description: |
            JWT de refresco (`typ=rt+jwt`, `aud=identity-service`). Ningún otro servicio lo acepta.
            Se canjea en `refreshTokens` y sirve una sola vez.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Segundos de vida del access token.
          example: 900

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty: { type: string, const: RSA }
              use: { type: string, const: sig }
              alg: { type: string, const: RS256 }
              kid: { type: string }
              n: { type: string }
              e: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]

    Problem:
      type: object
      description: RFC 9457 con las extensiones del proyecto (`code`, `correlationId`, `errors`).
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Estable, en UPPER_SNAKE_CASE.
          examples: [VALIDATION_ERROR, USER_EMAIL_ALREADY_REGISTERED, AUTH_INVALID_CREDENTIALS, AUTH_INVALID_REFRESH_TOKEN]
        correlationId: { type: string }
        errors:
          type: array
          description: Solo en errores de validación.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
