# Toda la configuración sale de variables de entorno (ver .env.example). Los valores por defecto
# sirven para correr en local con docker-compose.debug.yml.
spring.application.name=${SERVICE_NAME:listing-service}
server.port=${SERVICE_PORT:8002}
server.shutdown=graceful
# Menos que los 10 s de docker stop, para que la baja en Consul llegue a ocurrir.
spring.lifecycle.timeout-per-shutdown-phase=5s

# Base de datos (docs/base-de-datos/listing-service.md)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/listing}
spring.datasource.username=${DB_USER:listing}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# JWT emitido por identity-service (rule seguridad). Solo se aceptan access tokens (typ=at+jwt).
listing.security.jwks-uri=${JWKS_URI:http://identity-service:8001/api/v1/auth/.well-known/jwks.json}
listing.security.issuer=${JWT_ISSUER:identity-service}
listing.security.audience=${JWT_AUDIENCE:inmobiliaria}

# Errores RFC 9457
spring.mvc.problemdetails.enabled=true

# Logs en JSON, con el correlationId del MDC
logging.structured.format.console=logstash

# Health: /health no revisa dependencias (lo usa Consul); /health/ready revisa la base.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.group.live.include=ping
management.endpoint.health.group.live.additional-path=server:/health
management.endpoint.health.group.ready.include=db
# /health/ready lo sirve ReadinessController: additional-path solo admite un segmento.

# Registro en Consul (rule service-discovery)
spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${HOSTNAME:local}
spring.cloud.consul.discovery.health-check-path=/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.health-check-timeout=2s
spring.cloud.consul.discovery.health-check-critical-timeout=1m
# Si Consul no está, el servicio arranca igual; el re-registro periódico lo agrega después.
spring.cloud.consul.discovery.fail-fast=false
# listing no descubre a nadie (no llama por HTTP): no hace falta vigilar el catálogo de Consul.
spring.cloud.consul.discovery.catalog-services-watch.enabled=false

# Fechas en UTC y errores sin detalles internos
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-stacktrace=never
server.error.include-message=never

# Galería: 5 MB por imagen y hasta 5 imágenes por pedido
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
listing.images.dir=${IMAGE_STORAGE_DIR:/var/lib/listing/images}

# Kafka: productor idempotente (lo usa OutboxRelay) y consumidor de visit.lead.events con offsets manuales
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.group-id=listing-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
listing.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
listing.outbox.relay.interval-ms=${OUTBOX_POLL_MS:1000}
listing.outbox.relay.batch-size=100
listing.kafka.consumer.enabled=${KAFKA_CONSUMER_ENABLED:true}
# Reconstruye property_catalog desde properties al arrancar (mantenimiento, ver CLAUDE.md del servicio)
listing.catalog.rebuild-on-startup=${CATALOG_REBUILD_ON_STARTUP:false}

# Swagger UI en /docs (contrato: contracts/openapi/listing-service.yaml)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
