name: visit-dev

services:
  visit-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visit
      POSTGRES_USER: visit
      POSTGRES_PASSWORD: visit
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - visit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "visit", "-d", "visit"]
      interval: 3s
      timeout: 2s
      retries: 10

  visit-service:
    build: .
    depends_on:
      visit-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://visit:visit@visit-db:5432/visit
      SERVICE_PORT: "8003"
    ports:
      - "127.0.0.1:8003:8003"

volumes:
  visit-db-data:
