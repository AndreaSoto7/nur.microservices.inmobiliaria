version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - unconvert
  exclusions:
    rules:
      # Los tests levantan servidores locales, sin contextos de cancelación, y usan claves de prueba.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
