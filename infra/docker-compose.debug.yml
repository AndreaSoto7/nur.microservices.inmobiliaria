# Override para depurar desde el host. Publica puertos, todos SOLO en 127.0.0.1.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.debug.yml up -d
#
# No se combina con `--scale`: dos réplicas no pueden publicar el mismo puerto.

services:
  kafka:
    ports:
      - "127.0.0.1:9092:9092"

  identity-db:
    ports:
      - "127.0.0.1:5433:5432"

  identity-service:
    ports:
      - "127.0.0.1:8001:8001"

  listing-db:
    ports:
      - "127.0.0.1:5434:5432"

  listing-service:
    ports:
      - "127.0.0.1:8002:8002"
