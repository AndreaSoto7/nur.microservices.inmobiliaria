# Infraestructura local del proyecto (ADR 0002).
#
#   bash infra/scripts/generate-env.sh   # una sola vez: crea infra/.env
#   docker compose -f infra/docker-compose.yml up -d
#
# Puertos publicados en el host:
#   - La UI de Consul y la de Kafka, SOLO en 127.0.0.1. El 8500 sirve también la API de escritura de
#     Consul, sin ACL: desde otra máquina se podría registrar un servicio falso (rule seguridad).
#   - Los servicios y sus bases no publican nada: se ven por la red interna y por Consul. Así
#     funciona `--scale`. Para depurar desde el host, usa docker-compose.debug.yml.
#
# Ningún servicio usa container_name: impediría escalar.
# Cada responsable agrega aquí su servicio y su base, en su propio PR.

name: inmobiliaria

services:
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los topics se crean en kafka-init: un error de tipeo no debe crear un topic nuevo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea los topics del catálogo (contracts/events/README.md) y termina.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    volumes:
      - ./scripts/init-topics.sh:/init-topics.sh:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: inmobiliaria
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8090:8080"

  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Genera el .env con infra/scripts/generate-env.sh}
      POSTGRES_DB: identity
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build: ../services/identity-service
    depends_on:
      identity-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    # `environment` tiene prioridad: un .env de desarrollo no debe activar el modo debug aquí.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${IDENTITY_SECRET_KEY:?Genera el .env con infra/scripts/generate-env.sh}
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity?connect_timeout=3
      JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY:?Genera el .env con infra/scripts/generate-env.sh}
      CONSUL_ENABLED: "true"
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: identity-service
      SERVICE_PORT: "8001"

volumes:
  kafka-data:
  identity-db-data:
