# Infraestructura local del proyecto (ADR 0002).
#
#   bash infra/scripts/generate-env.sh   # una sola vez: crea infra/.env
#   docker compose -f infra/docker-compose.yml up -d
#
# Puertos publicados en el host:
#   - El gateway (8080) y el frontend (5173).
#   - La UI de Consul y la de Kafka, SOLO en 127.0.0.1. El 8500 sirve también la API de escritura de
#     Consul, sin ACL: desde otra máquina se podría registrar un servicio falso (rule seguridad).
#   - Los servicios y sus bases no publican nada: se ven por la red interna y por Consul. Así
#     funciona `--scale`. Para depurar desde el host, usa docker-compose.debug.yml.
#
# Ningún servicio usa container_name: impediría escalar.
# Cada responsable agrega aquí su servicio y su base, en su propio PR.

name: inmobiliaria

# Configuración común de identity-service, su relay del outbox y su limpieza.
x-identity-environment: &identity-environment
  DJANGO_SETTINGS_MODULE: config.settings.base
  # `environment` tiene prioridad: un .env de desarrollo no debe activar el modo debug aquí.
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${IDENTITY_SECRET_KEY:?Genera el .env con infra/scripts/generate-env.sh}
  DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity?connect_timeout=3
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # El servicio y la limpieza deben ver el mismo tope: si la limpieza usara uno menor, borraría una
  # familia revocada con tokens vivos, y esos tokens volverían a servir.
  JWT_REFRESH_TTL_SECONDS: ${IDENTITY_JWT_REFRESH_TTL_SECONDS:-604800}
  JWT_SESSION_MAX_SECONDS: ${IDENTITY_JWT_SESSION_MAX_SECONDS:-2592000}

services:
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los topics se crean en kafka-init: un error de tipeo no debe crear un topic nuevo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea los topics del catálogo (contracts/events/README.md) y termina.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    volumes:
      - ./scripts/init-topics.sh:/init-topics.sh:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: inmobiliaria
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8090:8080"

  # Único punto de entrada del cliente: es lo único de la API que se publica en el host.
  # Descubre las réplicas en Consul; si un servicio no está arriba, sus rutas responden 503.
  gateway:
    build: ../gateway
    depends_on:
      consul:
        condition: service_healthy
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    # Es lo único de la API expuesto hacia afuera: no necesita privilegios ni escribir en disco.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # UI (nginx sin root, con CSP). Se publica en 5173: es el origen que permite el CORS del gateway.
  # VITE_API_BASE_URL (build) y API_ORIGIN (CSP) deben ser la misma URL del gateway vista desde el navegador.
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    environment:
      API_ORIGIN: http://localhost:8080
    ports:
      - "5173:8080"

  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Genera el .env con infra/scripts/generate-env.sh}
      POSTGRES_DB: identity
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build: ../services/identity-service
    depends_on:
      identity-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      <<: *identity-environment
      # Solo identity-service firma tokens: su clave privada no se comparte con el relay.
      JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY:?Genera el .env con infra/scripts/generate-env.sh}
      CONSUL_ENABLED: "true"
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: identity-service
      SERVICE_PORT: "8001"

  # Publica en Kafka los eventos del outbox de identity. No es un servidor HTTP: no va a Consul.
  identity-outbox-relay:
    build: ../services/identity-service
    command: ["python", "manage.py", "run_outbox_relay"]
    depends_on:
      # identity-service aplica las migraciones al arrancar.
      identity-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *identity-environment
    healthcheck:
      disable: true
    restart: unless-stopped
    # Un flush a Kafka puede tardar hasta 15 s: más que los 10 s por defecto de docker stop.
    stop_grace_period: 20s

  identity-maintenance:
    build: ../services/identity-service
    command: ["python", "manage.py", "run_maintenance"]
    depends_on:
      # identity-service aplica las migraciones al arrancar.
      identity-service:
        condition: service_healthy
    environment:
      <<: *identity-environment
    healthcheck:
      disable: true
    restart: unless-stopped

  listing-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: listing
      POSTGRES_PASSWORD: ${LISTING_DB_PASSWORD:?Agrega LISTING_DB_PASSWORD a infra/.env (infra/.env.example)}
      POSTGRES_DB: listing
    volumes:
      - listing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U listing"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sin container_name ni puertos: es el servicio de la demo de balanceo (--scale listing-service=3).
  listing-service:
    build: ../services/listing-service
    depends_on:
      listing-db:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: listing-service
      SERVICE_PORT: "8002"
      DB_URL: jdbc:postgresql://listing-db:5432/listing
      DB_USER: listing
      DB_PASSWORD: ${LISTING_DB_PASSWORD:?Agrega LISTING_DB_PASSWORD a infra/.env (infra/.env.example)}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWKS_URI: http://identity-service:8001/api/v1/auth/.well-known/jwks.json
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      IMAGE_STORAGE_DIR: /var/lib/listing/images
    volumes:
      # Compartido entre réplicas: una imagen subida a una se sirve desde cualquiera.
      - listing-images:/var/lib/listing/images

volumes:
  kafka-data:
  identity-db-data:
  listing-db-data:
  listing-images:
